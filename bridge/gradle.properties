# Gradle Properties
#
# file.encoding=GBK is deliberate and load-bearing on Windows -- please read
# the "Java tests on Windows" section of ../../README.md before touching it.
#
# Short version: Gradle passes the test worker its classpath through an
# @argfile (E:\...\.tmp\gradle-worker-classpath*.txt) that it writes using the
# daemon's file.encoding, while the JVM reads @argfiles using sun.jnu.encoding
# -- GBK on a zh-CN Windows, and -Dsun.jnu.encoding cannot override it. With a
# UTF-8 argfile every non-ASCII classpath entry (this checkout lives under a
# Chinese directory name) is decoded into mojibake, so the whole suite fails
# with ClassNotFoundException even though the .class files are on disk.
# Matching the two encodings fixes it. On CI the checkout path is pure ASCII,
# so the setting is a no-op there.
org.gradle.jvmargs=-Xmx1G -Dfile.encoding=GBK

# Mod Properties
mod_version = 1.0.40
maven_group = com.minecraftbot
archives_base_name = baritone-api-bridge

# Fabric Properties
# Check https://fabricmc.net/develop/ for latest versions
minecraft_version=26.2
loader_version=0.19.3

# Dependencies
fabric_version=0.156.0+26.2
