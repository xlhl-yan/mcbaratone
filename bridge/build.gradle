plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
    id 'maven-publish'
    id 'jacoco'
}

loom {
    accessWidenerPath = file("src/main/resources/baritone-api-bridge.accesswidener")
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // HTTP client used by the bridge (Webb)
    // The real dependency is normally fetched from Maven Central, but some
    // environments (offline or restricted) cannot resolve it during CI/local
    // builds. A small local stub is provided under
    // src/main/java/com/goebl/david/Webb.java to allow compilation. If you
    // prefer the real client, replace the stub by adding the dependency and
    // allowing Gradle to fetch from Maven Central.
    // implementation 'com.goebl:david-webb:0.9'

    // Local Baritone API
    // The exact API JAR is tracked and verified by scripts/check_repository_hygiene.py.
    implementation files('libs/baritone-api-fabric-1.15.0-9-gd93f1582.jar')

    // WebSocket and networking - include to bundle in JAR (Jar-in-Jar)
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'
    include 'org.java-websocket:Java-WebSocket:1.5.3'
    implementation 'org.lz4:lz4-java:1.8.0'
    include 'org.lz4:lz4-java:1.8.0'

    // Testing dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    // Gradle 9 no longer puts the JUnit Platform launcher on the test runtime
    // classpath automatically.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testImplementation files('libs/baritone-api-fabric-1.15.0-9-gd93f1582.jar')
}

test {
    useJUnitPlatform()
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    // The sources are UTF-8 (they contain Chinese comments and chat prefixes).
    // Without this the compiler falls back to the platform default encoding,
    // which is GBK on a zh-CN Windows -- see the note about file.encoding in
    // gradle.properties for why the daemon may legitimately run as GBK here.
    it.options.encoding = 'UTF-8'
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Loom consumes the access widener during compilation, but Fabric Loader
    // still requires the declared file in the distributable mod JAR.
    from("src/main/resources/baritone-api-bridge.accesswidener")

}

tasks.register("verifyBridgeJarContents") {
    dependsOn tasks.jar

    doLast {
        def bridgeJar = tasks.jar.archiveFile.get().asFile
        def accessWidener = zipTree(bridgeJar).matching {
            include "baritone-api-bridge.accesswidener"
        }
        if (accessWidener.isEmpty()) {
            throw new GradleException(
                "Bridge JAR is missing baritone-api-bridge.accesswidener"
            )
        }
        def mixinConfig = zipTree(bridgeJar).matching {
            include "baritone-api-bridge.mixins.json"
        }
        def mixinClass = zipTree(bridgeJar).matching {
            include "com/minecraftbot/baritone/mixin/BlockOptionalMetaMixin.class"
        }
        if (mixinConfig.isEmpty() || mixinClass.isEmpty()) {
            throw new GradleException(
                "Bridge JAR is missing the required client-safe Baritone mixin"
            )
        }
    }
}

tasks.check.dependsOn tasks.verifyBridgeJarContents
